<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{MEETING_TITLE}} 회의록 ({{DATE}})</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #1d4ed8;
      --accent-soft: #eff6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px;
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 44px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .meta-item strong {
      color: var(--text);
      font-weight: 600;
      margin-right: 6px;
    }

    .session-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .session-tab {
      appearance: none;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .session-tab:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .session-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.22);
    }

    .session {
      display: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 20px;
      background: #fcfdff;
    }

    .session.active {
      display: block;
    }

    .session-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .session-num {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent);
      padding: 3px 9px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .session h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .topic-group {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .topic-group:first-of-type {
      margin-top: 8px;
      padding-top: 0;
      border-top: none;
    }

    .topic-group h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .compare-table th,
    .compare-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    .compare-table th:last-child,
    .compare-table td:last-child {
      border-right: none;
    }

    .compare-table tr:last-child td {
      border-bottom: none;
    }

    .compare-table thead th {
      background: #f1f5f9;
      font-weight: 700;
      color: var(--text);
    }

    .compare-table thead th.modern-col {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .compare-table tbody th {
      width: 110px;
      background: #f8fafc;
      font-weight: 700;
      color: var(--text);
    }

    sup.fn-ref {
      font-size: 11px;
      margin-left: 2px;
    }

    sup.fn-ref a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--accent-soft);
    }

    sup.fn-ref a:hover {
      background: var(--accent);
      color: #ffffff;
    }

    sup.fn-ref.fn-question a {
      color: #ea580c;
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    sup.fn-ref.fn-question a:hover {
      background: #ea580c;
      color: #ffffff;
      border-color: #ea580c;
    }

    sup.fn-ref.fn-opinion a {
      color: #059669;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    sup.fn-ref.fn-opinion a:hover {
      background: #059669;
      color: #ffffff;
      border-color: #059669;
    }

    .footnotes {
      display: none;
      margin-top: 28px;
      padding: 20px 24px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13.5px;
    }

    .footnotes h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .footnotes ol {
      margin: 0;
      padding-left: 20px;
    }

    .footnotes li {
      margin-bottom: 12px;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .fn-title {
      font-weight: 600;
      color: var(--text);
    }

    .fn-summary {
      margin: 4px 0;
      color: #334155;
    }

    .fn-link {
      font-size: 12.5px;
      word-break: break-all;
    }

    .fn-link a {
      color: var(--accent);
    }

    .fn-back {
      margin-left: 6px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }

    .fn-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .fn-modal-backdrop.open {
      display: flex;
    }

    .fn-modal {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.18);
      padding: 22px 24px;
      animation: fnPop 0.15s ease-out;
    }

    @keyframes fnPop {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .fn-modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .fn-modal-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .fn-modal-badge.is-question {
      color: #ea580c;
      background: #fff7ed;
    }

    .fn-modal-badge.is-opinion {
      color: #059669;
      background: #ecfdf5;
    }

    .fn-modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    .fn-modal-close {
      border: none;
      background: #f1f5f9;
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .fn-modal-close:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    .fn-modal-summary {
      margin: 0 0 14px;
      font-size: 14px;
      color: #334155;
      line-height: 1.65;
    }

    .fn-modal-links {
      font-size: 13px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      word-break: break-all;
    }

    .fn-modal-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .fn-modal-links a:hover {
      text-decoration: underline;
    }

    .placeholder {
      margin: 0;
      color: var(--muted);
      font-style: italic;
      font-size: 14px;
    }

    ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .container {
        box-shadow: none;
        border: none;
        padding: 0;
      }
      .session-tabs {
        display: none;
      }
      .session {
        display: block !important;
      }
      .footnotes {
        display: block;
      }
      .fn-modal-backdrop {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">회의록</span>
      <h1>{{MEETING_TITLE}}</h1>
      <div class="meta-grid">
        <div class="meta-item"><strong>일시</strong> {{DATE}}</div>
        <div class="meta-item"><strong>장소</strong> {{LOCATION}}</div>
      </div>
    </header>

    <main>
      <nav class="session-tabs" id="sessionTabs" aria-label="세션 탭">
        <button type="button" class="session-tab active" data-target="session-1">세션 1. {{SESSION_1_TITLE}}</button>
      </nav>

      <section class="session active" id="session-1">
        <div class="session-header">
          <span class="session-num">세션 1</span>
          <h2>{{SESSION_1_TITLE}}</h2>
        </div>
        <p class="placeholder">내용 입력 대기 중...</p>
      </section>

      <section class="footnotes" id="footnotes">
        <h2>참고 및 근거자료 (각주)</h2>
        <ol>
          <!-- 각주 항목 (<li id="fn-1">...</li>) 추가 위치 -->
        </ol>
      </section>
    </main>

    <footer>
      최종 업데이트: {{UPDATED_AT}}
    </footer>
  </div>

  <div class="fn-modal-backdrop" id="fnModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="fnModalTitle">
    <div class="fn-modal">
      <div class="fn-modal-header">
        <div>
          <span class="fn-modal-badge" id="fnModalBadge">각주</span>
          <h3 class="fn-modal-title" id="fnModalTitle"></h3>
        </div>
        <button class="fn-modal-close" id="fnModalClose" type="button" aria-label="닫기">✕</button>
      </div>
      <p class="fn-modal-summary" id="fnModalSummary"></p>
      <div class="fn-modal-links" id="fnModalLinks"></div>
    </div>
  </div>

  <script>
    (function () {
      const backdrop = document.getElementById('fnModalBackdrop');
      const badgeEl = document.getElementById('fnModalBadge');
      const titleEl = document.getElementById('fnModalTitle');
      const summaryEl = document.getElementById('fnModalSummary');
      const linksEl = document.getElementById('fnModalLinks');
      const closeBtn = document.getElementById('fnModalClose');

      function closeModal() {
        backdrop.classList.remove('open');
      }

      document.addEventListener('click', function (e) {
        const anchor = e.target.closest('sup.fn-ref a');
        if (!anchor) return;

        const targetId = anchor.getAttribute('href');
        if (!targetId || !targetId.startsWith('#')) return;

        const fnItem = document.querySelector(targetId);
        if (!fnItem) return;

        e.preventDefault();

        const titleNode = fnItem.querySelector('.fn-title');
        const summaryNode = fnItem.querySelector('.fn-summary');
        const linkNode = fnItem.querySelector('.fn-link');

        let cleanTitle = '';
        if (titleNode) {
          const clone = titleNode.cloneNode(true);
          clone.querySelectorAll('.fn-back').forEach(el => el.remove());
          cleanTitle = clone.textContent.trim();
        }

        const parentSup = anchor.closest('sup.fn-ref');
        badgeEl.classList.remove('is-question', 'is-opinion');
        if (parentSup && parentSup.classList.contains('fn-question')) {
          badgeEl.classList.add('is-question');
          badgeEl.textContent = '질문 [?]';
        } else if (parentSup && parentSup.classList.contains('fn-opinion')) {
          badgeEl.classList.add('is-opinion');
          badgeEl.textContent = '의견 [!]';
        } else {
          badgeEl.textContent = '근거자료 ' + anchor.textContent.trim();
        }
        titleEl.textContent = cleanTitle;
        summaryEl.textContent = summaryNode ? summaryNode.textContent.trim() : '';
        linksEl.innerHTML = linkNode ? linkNode.innerHTML : '';

        backdrop.classList.add('open');
      });

      closeBtn.addEventListener('click', closeModal);
      backdrop.addEventListener('click', function (e) {
        if (e.target === backdrop) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && backdrop.classList.contains('open')) {
          closeModal();
        }
      });

      const sessionTabs = document.getElementById('sessionTabs');
      if (sessionTabs) {
        sessionTabs.addEventListener('click', function (e) {
          const tab = e.target.closest('.session-tab');
          if (!tab) return;
          const targetId = tab.getAttribute('data-target');
          if (!targetId) return;

          document.querySelectorAll('.session-tab').forEach(el => el.classList.remove('active'));
          document.querySelectorAll('.session').forEach(el => el.classList.remove('active'));

          tab.classList.add('active');
          const targetSection = document.getElementById(targetId);
          if (targetSection) targetSection.classList.add('active');
        });
      }
    })();
  </script>
</body>
</html>
