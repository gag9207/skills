<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DECK_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ===========================================
   STAGE COLOURS
   =========================================== */
:root{--stage-bg:#333333;--slide-bg:#fff}
*{margin:0;padding:0;box-sizing:border-box}
/*{{CSS_BASE}}*/
/*{{CSS_DECK}}*/
/* ===========================================
   PRESENTATION CHROME (outside the slide stage)
   =========================================== */
.deck-controls{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.55);color:#E8E8E9;font:14px "IBM Plex Sans KR","Malgun Gothic",sans-serif;padding:6px 12px;border-radius:999px;opacity:.15;transition:opacity .3s}
.deck-controls:hover{opacity:1}
.deck-controls button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font:inherit}
@media print{.slide{visibility:visible!important;opacity:1!important}}
</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
<!--{{SLIDES}}-->
  </main>
</div>
<nav class="deck-controls" aria-label="슬라이드 이동">
  <button type="button" id="prevBtn" aria-label="이전">◀</button>
  <span id="counter">1</span>
  <button type="button" id="nextBtn" aria-label="다음">▶</button>
  <button type="button" id="fsBtn">전체 화면</button>
</nav>
<script>
/* ===========================================
   SLIDE PRESENTATION CONTROLLER
   Arrow keys / Space / PageUp-Down, mouse wheel, swipe, #page hash.
   =========================================== */
class SlidePresentation{
  constructor(){
    this.slides=[...document.querySelectorAll('.deck-stage > .slide')];
    this.stage=document.getElementById('deckStage');
    this.counter=document.getElementById('counter');
    this.cur=0;this.wheelLock=0;
    this.scale();addEventListener('resize',()=>this.scale());
    addEventListener('keydown',e=>{
      if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();this.go(this.cur+1);}
      else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();this.go(this.cur-1);}
      else if(e.key==='Home')this.go(0); else if(e.key==='End')this.go(this.slides.length-1);
    });
    addEventListener('wheel',e=>{const t=Date.now();if(t-this.wheelLock<600||Math.abs(e.deltaY)<20)return;this.wheelLock=t;this.go(this.cur+(e.deltaY>0?1:-1));},{passive:true});
    let sx=null;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
    addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)this.go(this.cur+(dx<0?1:-1));sx=null;});
    document.getElementById('prevBtn').onclick=()=>this.go(this.cur-1);
    document.getElementById('nextBtn').onclick=()=>this.go(this.cur+1);
    document.getElementById('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
    const h=parseInt(location.hash.slice(1),10);this.go(h>0?h-1:0);
  }
  scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
  go(i){
    this.cur=Math.max(0,Math.min(i,this.slides.length-1));
    this.slides.forEach((s,k)=>{s.classList.toggle('active',k===this.cur);s.classList.toggle('visible',k===this.cur);});
    this.counter.textContent=(this.cur+1)+' / '+this.slides.length;
    history.replaceState(null,'','#'+(this.cur+1));
  }
}
new SlidePresentation();
</script>
</body>
</html>
